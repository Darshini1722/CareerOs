<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerOS - Signup</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>


    <div class="main-content">

        <!-- Page Content Goes Here -->

    </div>

</div>
<div class="signup-container">

    <div class="signup-card">

        <h2>Create Your CareerOS Account</h2>

        <p class="subtitle">
            Start your career journey today
        </p>

        <!-- Success Message -->

        <div id="successMessage" class="success-message">
            ✅ Account Created Successfully! Redirecting...
        </div>

        <!-- First Name -->

        <input
            type="text"
            id="firstName"
            placeholder="First Name">

        <p id="firstNameError" class="error-message"></p>

        <!-- Middle Name -->

        <input
            type="text"
            id="middleName"
            placeholder="Middle Name (Optional)">

        <!-- Last Name -->

        <input
            type="text"
            id="lastName"
            placeholder="Last Name">

        <p id="lastNameError" class="error-message"></p>

        <!-- Email -->

        <input
            type="email"
            id="email"
            placeholder="Email Address">

        <p id="emailError" class="error-message"></p>

        <!-- Password -->

        <div class="password-container">

            <input
                type="password"
                id="password"
                placeholder="Password">

            <span onclick="togglePassword('password')">
                👁️
            </span>

        </div>

        <p id="passwordError" class="error-message"></p>

        <!-- Confirm Password -->

        <div class="password-container">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password">

            <span onclick="togglePassword('confirmPassword')">
                👁️
            </span>

        </div>

        <p id="confirmPasswordError" class="error-message"></p>

        <!-- Button -->

        <button onclick="validateSignup()">
            Create Account
        </button>

        <!-- Login Link -->

        <p class="signup-text">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </p>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
